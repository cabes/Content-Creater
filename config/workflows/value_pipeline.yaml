# Value Pipeline - 认知价值层 (低频精品)
# Full pipeline: 深度选题 → 体系化写作 → 合规 → TTS → 视频 → 文章 → 发布
workflow:
  name: value_pipeline
  description: "知识建筑师模式：全链路精品"
  schedule: "weekly"
  trigger_on: hook_traffic_threshold

  stages:
    - topic_engine:
        mode: knowledge_architect
        source: [hook_feedback, knowledge_graph, manual]
        max_topics: 3

    - text_creator:
        layer: value
        min_length: 3000
        framework: true
        monetization_anchor: true
        quality_check: true
        min_quality_score: 7.0

    - compliance:
        enabled: true
        auto_fix: true
        max_risk_level: 3

    - tts_engine:
        speed: moderate
        style: authoritative

    - video_maker:
        max_duration: 900
        engines: [remotion, manim, mystical]
        max_scenes: 20

    - article_formatter: {}

    - publisher:
        platforms: [bilibili, wechat, podcast]
        cta_inject: true
