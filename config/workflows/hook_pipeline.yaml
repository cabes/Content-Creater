# Hook Pipeline - 情绪流量层 (高频快速)
workflow:
  name: hook_pipeline
  description: "情绪猎手模式：热点扫描 → 情绪分析 → Hook文案 → 合规检查"
  schedule: "every 2h"

  stages:
    - topic_engine:
        mode: emotion_hunter
        sentiment_scan: true
        max_topics: 5
        # domain set at runtime or defaults to config

    - text_creator:
        layer: hook
        max_length: 800
        auto_link_value_topic: true
        quality_check: true
        min_quality_score: 6.0

